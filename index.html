<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Salto Angel - Three.js Engine</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;

        background: #000;

  </head>

    <canvas id="webgl-canvas"></canvas>
    <script type="module" src="/src/main.js"></script>
